name: CI
on:
  pull_request:
  push:
    branches-ignore:
    - dependabot/*
    - renovate/*
  schedule:
  - cron: 0 0 * * 0
  workflow_dispatch:
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
        - '3.1'
        - '3.2'
        - '3.3'
        - '3.4'
        bundler-version:
        - '2.4'
        - '2.5'
        - '2.6'
        - '2.7'
        - '4.0'
        exclude:
        - ruby-version: '3.1'
          bundler-version: '2.7'
        - ruby-version: '3.1'
          bundler-version: '4.0'
    env:
      TEST_BUNDLER_VERSION: "${{ matrix.bundler-version }}"
    steps:
    - uses: actions/checkout@v6
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "${{ matrix.ruby-version }}"
        bundler: "${{ matrix.bundler-version }}"
        bundler-cache: true
      timeout-minutes: 30
    - name: Run tests
      run: bundle exec rake
